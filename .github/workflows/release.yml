name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test (full suite)
        run: cargo test --locked
      - name: Release build
        run: cargo build --locked --release
      - name: Stage portable exe and drinks pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/favelists.exe "dist/FaveLists-${{ github.ref_name }}-portable.exe"
          Copy-Item data/drinks.json "dist/drinks.json"
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" installer\FaveLists.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble portable zip
        shell: pwsh
        run: |
          $stage = "dist/portable-root"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "dist/FaveLists-${{ github.ref_name }}-portable.exe" $stage
          Copy-Item LICENSE $stage
          Copy-Item PORTABLE.txt $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/FaveLists-${{ github.ref_name }}-portable.zip"
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FaveLists-Setup-${{ github.ref_name }}-x64.exe
            dist/FaveLists-${{ github.ref_name }}-portable.zip
            dist/drinks.json
          fail_on_unmatched_files: true
